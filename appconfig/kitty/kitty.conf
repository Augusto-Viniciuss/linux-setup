# Kitty GPU-accelerated terminal, based on appconfig/urxvt/dotXresources.
font_family Inconsolata
font_size 14.0
background #121212
foreground #dddddd
background_opacity 1.0
scrollback_lines 10000
enable_audio_bell no
copy_on_select clipboard
term xterm-kitty

color0  #1C1C1C
color8  #404040
color1  #B85335
color9  #CF6A4C
color2  #79AD6A
color10 #99DD6A
color3  #FFB964
color11 #FAD07A
color4  #667899
color12 #8197BF
color5  #A7A7FF
color13 #C6B6EE
color6  #668799
color14 #8FBFDC
color7  #888888
color15 #E8E8D3

# The Super+C menu replaces this include with the chosen legacy colorscheme.
include current-theme.conf

# Keep the font-size and clipboard shortcuts from urxvt.
map ctrl+minus change_font_size current -1.0
map ctrl+plus change_font_size current +1.0
map ctrl+equal change_font_size current 0
map ctrl+shift+v paste_from_clipboard

# These sequences are consumed by the existing tmux key bindings.
map ctrl+shift+p send_text all \x1b[24;5~
map ctrl+1 send_text all \x1b[27;5;49~
map ctrl+2 send_text all \x1b[27;5;50~
map ctrl+3 send_text all \x1b[27;5;51~
map ctrl+4 send_text all \x1b[27;5;52~
map ctrl+5 send_text all \x1b[27;5;53~
map ctrl+6 send_text all \x1b[27;5;54~
map ctrl+7 send_text all \x1b[27;5;55~
map ctrl+8 send_text all \x1b[27;5;56~
map ctrl+9 send_text all \x1b[27;5;57~
map ctrl+0 send_text all \x1b[27;5;48~
